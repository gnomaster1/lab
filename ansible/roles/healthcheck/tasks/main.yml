---
# tasks file for ansible/roles/healthcheck
- name: validate nginx port
  ansible.builtin.assert:
    that:
      - nginx_lab_port >= 1  and nginx_lab_port <= 65535


- name: Send http request
  ansible.builtin.uri:
    url: "{{ healthcheck_url }}"
    method: GET
    status_code: [200, 404]
  changed_when: false
  register: http_check




- name: validate http status
  ansible.builtin.assert:
    that:
      - http_check.status == 200
    fail_msg: "Nginx healthcheck failed"
    success_msg: "Nginx is available"

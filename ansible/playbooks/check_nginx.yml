---
- name: Check Nginx response
  hosts: all
  gather_facts: false

  tasks:
    - name: check nginx port 
      ansible.builtin.uri:
        url: http://localhost:8084
        method: GET
        status_code: [404, 200]
      register: nginx_response 
    
    - name: show http status
      ansible.builtin.assert:
        that:
          - nginx_response.status == 200
        fail_msg: "FAILED"
        success_msg: "SUCCESS"
    
